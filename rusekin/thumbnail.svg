<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <radialGradient id="bg" cx=".5" cy="0" r="1.1">
      <stop offset="0" stop-color="#34206e"/>
      <stop offset=".7" stop-color="#120b26"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".55" stop-color="#ffb648"/>
      <stop offset="1" stop-color="#ff6f91"/>
    </linearGradient>
    <linearGradient id="back" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3a2478"/>
      <stop offset="1" stop-color="#1b1040"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f0e2c4"/>
    </linearGradient>
    <path id="mask" fill-rule="evenodd" d="M6 14C26 2 48 6 60 16 72 6 94 2 114 14c2 22-10 36-28 36-12 0-20-7-26-14-6 7-14 14-26 14C16 50 4 36 6 14zM24 24c4-5 14-6 22 0-6 7-16 8-22 0zm72 0c-4-5-14-6-22 0 6 7 16 8 22 0z"/>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <circle cx="40" cy="160" r="60" fill="#ff5c8a" opacity=".14"/>
  <circle cx="290" cy="20" r="50" fill="#7b3cff" opacity=".25"/>

  <!-- fanned cards: five face-down, one face-up blank -->
  <g transform="translate(160 186)">
    <g transform="rotate(-36)"><rect x="-26" y="-150" width="52" height="74" rx="7" fill="url(#back)" stroke="#ffcf5a" stroke-opacity=".6" stroke-width="1.5"/><use href="#mask" transform="translate(-14 -120) scale(.24)" fill="#ffcf5a" opacity=".7"/></g>
    <g transform="rotate(-21)"><rect x="-26" y="-150" width="52" height="74" rx="7" fill="url(#back)" stroke="#ffcf5a" stroke-opacity=".6" stroke-width="1.5"/><use href="#mask" transform="translate(-14 -120) scale(.24)" fill="#ffcf5a" opacity=".7"/></g>
    <g transform="rotate(21)"><rect x="-26" y="-150" width="52" height="74" rx="7" fill="url(#back)" stroke="#ffcf5a" stroke-opacity=".6" stroke-width="1.5"/><use href="#mask" transform="translate(-14 -120) scale(.24)" fill="#ffcf5a" opacity=".7"/></g>
    <g transform="rotate(36)"><rect x="-26" y="-150" width="52" height="74" rx="7" fill="url(#back)" stroke="#ffcf5a" stroke-opacity=".6" stroke-width="1.5"/><use href="#mask" transform="translate(-14 -120) scale(.24)" fill="#ffcf5a" opacity=".7"/></g>
    <g transform="rotate(-7)">
      <rect x="-30" y="-160" width="60" height="86" rx="8" fill="url(#paper)" stroke="#8f9bff" stroke-width="2"/>
      <rect x="-20" y="-152" width="40" height="10" rx="5" fill="#24123a"/>
      <text x="0" y="-144.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" font-weight="800" fill="#ffcf5a" letter-spacing=".6">PIZZA</text>
      <text x="0" y="-104" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#24123a">🍕</text>
    </g>
    <g transform="rotate(8)">
      <rect x="-30" y="-160" width="60" height="86" rx="8" fill="url(#paper)" stroke="#ff5c7a" stroke-width="2"/>
      <text x="0" y="-100" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#ff5c7a">?</text>
    </g>
  </g>

  <!-- logo -->
  <use href="#mask" transform="translate(128 12) scale(.53)" fill="url(#gold)"/>
  <text x="160" y="64" text-anchor="middle" font-family="Palatino,Georgia,serif" font-weight="700" font-size="24" letter-spacing="6" fill="url(#gold)">RUSEKIN</text>

  <!-- speech bubbles -->
  <g font-family="system-ui,sans-serif" font-weight="800" font-size="12" text-anchor="middle">
    <path d="M14 82h58a8 8 0 0 1 8 8v14a8 8 0 0 1-8 8H48l-10 8v-8H14a8 8 0 0 1-8-8V90a8 8 0 0 1 8-8z" fill="#2ed3a0"/>
    <text x="43" y="101" fill="#08281e">cheese!</text>
    <path d="M248 92h58a8 8 0 0 1 8 8v14a8 8 0 0 1-8 8h-24v8l-10-8h-24a8 8 0 0 1-8-8v-14a8 8 0 0 1 8-8z" fill="#ff9f43"/>
    <text x="277" y="111" fill="#24123a">round…?</text>
  </g>
  <g fill="#ffcf5a"><circle cx="96" cy="30" r="2.5"/><circle cx="232" cy="46" r="2"/><circle cx="20" cy="40" r="1.8"/><circle cx="300" cy="150" r="2.2"/></g>
</svg>
