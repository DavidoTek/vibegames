<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" shape-rendering="crispEdges">
  <!-- sky bands -->
  <rect width="160" height="15" fill="#9ccbe4"/>
  <rect y="15" width="160" height="15" fill="#b2d4e2"/>
  <rect y="30" width="160" height="15" fill="#c8dcdc"/>
  <rect y="45" width="160" height="15" fill="#ecdfb2"/>
  <rect y="60" width="160" height="30" fill="#f4d89a"/>
  <!-- sun -->
  <rect x="124" y="8" width="12" height="16" fill="#fff4c8"/>
  <rect x="120" y="12" width="20" height="8" fill="#fff4c8"/>
  <!-- giant stalks -->
  <rect x="14" y="10" width="3" height="50" fill="#e0c486"/>
  <rect x="12" y="4" width="6" height="8" fill="#b08850"/>
  <rect x="96" y="20" width="4" height="40" fill="#78c050"/>
  <rect x="104" y="14" width="3" height="46" fill="#58a03a"/>
  <rect x="146" y="26" width="4" height="34" fill="#78c050"/>
  <!-- ground left -->
  <rect x="0" y="60" width="58" height="30" fill="#b88a56"/>
  <rect x="0" y="60" width="58" height="2" fill="#ecd59c"/>
  <rect x="0" y="62" width="58" height="1" fill="#d2ae70"/>
  <!-- ground right -->
  <rect x="98" y="60" width="62" height="30" fill="#8a5a36"/>
  <rect x="98" y="60" width="62" height="2" fill="#82cc4c"/>
  <rect x="98" y="62" width="62" height="1" fill="#4f9a32"/>
  <!-- gorge with thorns -->
  <rect x="58" y="82" width="40" height="8" fill="#9a6f42"/>
  <rect x="60" y="78" width="1" height="4" fill="#5e3a2a"/>
  <rect x="66" y="77" width="1" height="5" fill="#5e3a2a"/>
  <rect x="72" y="78" width="1" height="4" fill="#5e3a2a"/>
  <rect x="80" y="77" width="1" height="5" fill="#5e3a2a"/>
  <rect x="88" y="78" width="1" height="4" fill="#5e3a2a"/>
  <rect x="94" y="77" width="1" height="5" fill="#5e3a2a"/>
  <!-- stone ant bridge -->
  <g fill="#908d98" stroke="#5c5a62" stroke-width="1">
    <rect x="58.5" y="60.5" width="7" height="7"/>
    <rect x="66.5" y="60.5" width="7" height="7"/>
    <rect x="74.5" y="60.5" width="7" height="7"/>
  </g>
  <rect x="59" y="61" width="6" height="1" fill="#c2bfc8"/>
  <rect x="67" y="61" width="6" height="1" fill="#c2bfc8"/>
  <rect x="75" y="61" width="6" height="1" fill="#c2bfc8"/>
  <!-- ants: body, head, legs -->
  <g fill="#6b2412">
    <rect x="20" y="56" width="4" height="2"/><rect x="25" y="56" width="2" height="2"/><rect x="27" y="55" width="2" height="2"/>
    <rect x="34" y="56" width="4" height="2"/><rect x="39" y="56" width="2" height="2"/><rect x="41" y="55" width="2" height="2"/>
    <rect x="48" y="56" width="4" height="2"/><rect x="53" y="56" width="2" height="2"/><rect x="55" y="55" width="2" height="2"/>
  </g>
  <g fill="#2c0e06">
    <rect x="21" y="58" width="1" height="2"/><rect x="24" y="58" width="1" height="2"/><rect x="27" y="58" width="1" height="2"/>
    <rect x="35" y="58" width="1" height="2"/><rect x="38" y="58" width="1" height="2"/><rect x="41" y="58" width="1" height="2"/>
    <rect x="49" y="58" width="1" height="2"/><rect x="52" y="58" width="1" height="2"/><rect x="55" y="58" width="1" height="2"/>
    <rect x="29" y="54" width="1" height="1"/><rect x="43" y="54" width="1" height="1"/><rect x="57" y="54" width="1" height="1"/>
  </g>
  <!-- the leader, mid-jump -->
  <g fill="#a8462a">
    <rect x="84" y="46" width="4" height="2"/><rect x="89" y="46" width="2" height="2"/><rect x="91" y="45" width="2" height="2"/>
  </g>
  <rect x="85" y="48" width="1" height="2" fill="#2c0e06"/><rect x="90" y="48" width="1" height="2" fill="#2c0e06"/>
  <rect x="86" y="40" width="5" height="1" fill="#ffd23a"/><rect x="87" y="41" width="3" height="1" fill="#ffd23a"/><rect x="88" y="42" width="1" height="1" fill="#ffd23a"/>
  <!-- grass tuft -->
  <g fill="#5aa83a"><rect x="116" y="52" width="1" height="8"/><rect x="119" y="50" width="1" height="10"/><rect x="122" y="53" width="1" height="7"/></g>
  <g fill="#3f8a2a"><rect x="117" y="54" width="1" height="6"/><rect x="121" y="51" width="1" height="9"/></g>
  <!-- bird -->
  <g fill="#7a5030">
    <rect x="30" y="18" width="20" height="6"/><rect x="48" y="15" width="7" height="6"/>
  </g>
  <rect x="55" y="17" width="3" height="2" fill="#f0a020"/>
  <rect x="34" y="22" width="14" height="3" fill="#d8c098"/>
  <rect x="34" y="10" width="10" height="8" fill="#5a3a22"/>
  <rect x="24" y="19" width="7" height="3" fill="#5a3a22"/>
  <rect x="51" y="16" width="1" height="1" fill="#101010"/>
</svg>
