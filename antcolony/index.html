<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ant Colony</title>
  <link rel="icon" href="thumbnail.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <nav class="corner">
    <a class="chip" href="../" title="Back to all games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span>Games</span>
    </a>
    <button id="mute" class="chip icon" type="button" title="Sound on/off (M)" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button id="pause" class="chip icon" type="button" title="Pause and help (P)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
    </button>
  </nav>

  <div id="hud" class="card" hidden>
    <div id="lvl" class="lvl"></div>
    <div class="stats">
      <span title="Ants left"><i class="ico ant"></i><b id="ants">0</b></span>
      <span title="Turned to stone"><i class="ico stone"></i><b id="stones">0</b></span>
      <span title="Taken by birds"><i class="ico bird"></i><b id="eaten">0</b></span>
    </div>
  </div>

  <div id="msg" class="msg" aria-live="polite"></div>

  <div id="touch" hidden>
    <div class="cluster">
      <button type="button" data-act="left" aria-label="Walk left">&#9664;</button>
      <button type="button" data-act="right" aria-label="Walk right">&#9654;</button>
    </div>
    <div class="cluster">
      <div class="stack">
        <button type="button" data-act="up" class="small" aria-label="Climb">&#9650;</button>
        <button type="button" data-act="down" class="small" aria-label="Dig or drop">&#9660;</button>
      </div>
      <button type="button" data-act="act" class="stone" aria-label="Hold to turn to stone">X</button>
      <button type="button" data-act="jump" class="jump">Jump</button>
    </div>
  </div>

  <section id="panel" class="panel"></section>

  <script type="module" src="game.js"></script>
</body>
</html>
