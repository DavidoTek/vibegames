<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc0f5"/><stop offset="1" stop-color="#cdeeff"/></linearGradient>
<linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#2f7fe0"/></linearGradient>
</defs>
<rect width="640" height="360" fill="url(#sky)"/>
<!-- far hills and clouds -->
<ellipse cx="90" cy="300" rx="170" ry="120" fill="#8fd08a"/>
<ellipse cx="330" cy="320" rx="200" ry="110" fill="#7cc66f"/>
<ellipse cx="580" cy="300" rx="170" ry="130" fill="#8fd08a"/>
<g fill="#ffffff"><circle cx="110" cy="70" r="22"/><circle cx="138" cy="62" r="28"/><circle cx="168" cy="72" r="20"/>
<circle cx="470" cy="52" r="18"/><circle cx="494" cy="44" r="24"/><circle cx="520" cy="54" r="17"/></g>
<!-- ground: blocks drawn as front face plus a top face for the 3D look -->
<g>
<polygon points="0,262 40,240 640,240 640,262" fill="#7ed66a"/>
<rect y="262" width="640" height="16" fill="#5cc04a"/>
<rect y="278" width="640" height="82" fill="#a0693c"/>
<g stroke="#8a5830" stroke-width="3"><path d="M0 318H640M64 278V360M128 278V360M192 278V360M256 278V360M320 278V360M384 278V360M448 278V360M512 278V360M576 278V360"/></g>
</g>
<!-- bonus blocks -->
<g>
<polygon points="196,118 212,106 340,106 324,118" fill="#ffd36b"/>
<polygon points="324,118 340,106 340,170 324,182" fill="#c98a10"/>
<rect x="196" y="118" width="64" height="64" fill="#ffb627" stroke="#c97a00" stroke-width="4"/>
<rect x="260" y="118" width="64" height="64" fill="#c9774a" stroke="#9a5530" stroke-width="4"/>
<text x="228" y="166" font-family="sans-serif" font-weight="900" font-size="44" fill="#fff6d8" text-anchor="middle">?</text>
</g>
<!-- coins -->
<g fill="#ffcc33" stroke="#d69614" stroke-width="4">
<ellipse cx="228" cy="80" rx="13" ry="17"/><ellipse cx="292" cy="80" rx="6" ry="17"/>
<ellipse cx="452" cy="196" rx="13" ry="17"/><ellipse cx="500" cy="196" rx="9" ry="17"/>
</g>
<!-- gem -->
<polygon points="560,100 584,128 560,170 536,128" fill="url(#gem)" stroke="#1d5bb0" stroke-width="3"/>
<polygon points="560,100 568,128 560,170 552,128" fill="#ffffff" opacity="0.35"/>
<!-- enemy -->
<ellipse cx="400" cy="226" rx="30" ry="22" fill="#8a4fd8"/>
<circle cx="390" cy="220" r="7" fill="#fff"/><circle cx="410" cy="220" r="7" fill="#fff"/>
<circle cx="392" cy="221" r="3.5" fill="#1a1420"/><circle cx="412" cy="221" r="3.5" fill="#1a1420"/>
<path d="M382 208l14 5M418 208l-14 5" stroke="#1a1420" stroke-width="3.5" stroke-linecap="round"/>
<!-- player mid-jump -->
<g transform="translate(118 168) rotate(-8)">
<rect x="-26" y="-34" width="52" height="68" rx="26" fill="#ff7a3d"/>
<rect x="-26" y="-20" width="52" height="7" fill="#2ec4b6"/>
<ellipse cx="-2" cy="-2" rx="7" ry="9" fill="#fff"/><ellipse cx="16" cy="-2" rx="7" ry="9" fill="#fff"/>
<ellipse cx="1" cy="-3" rx="3.5" ry="5" fill="#1a1420"/><ellipse cx="19" cy="-3" rx="3.5" ry="5" fill="#1a1420"/>
<rect x="-20" y="32" width="14" height="9" rx="2" fill="#3a3f4a"/><rect x="6" y="28" width="14" height="9" rx="2" fill="#3a3f4a"/>
</g>
<ellipse cx="118" cy="250" rx="24" ry="5" fill="#2f6a2a" opacity="0.35"/>
</svg>
